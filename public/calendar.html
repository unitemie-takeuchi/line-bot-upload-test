<!-- calendar.html -->
<input type="date" id="pickDate">
<button onclick="send()">選択</button>

<script>
function send() {
  const date = document.getElementById('pickDate').value;
  if (liff.isApiAvailable()) {
    liff.sendMessages([{ type: 'text', text: `選ばれた日付：${date}` }])
      .then(() => liff.closeWindow());
  }
}
</script>
