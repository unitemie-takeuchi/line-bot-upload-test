<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MV不良報告書一覧</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1em;
      background: #f7f7f7;
    }

    h1 {
      font-size: 1em;
      margin: 0 0 10px 0;
      color: #666;
    }

    .action-row {
      margin-bottom: 15px;
    }

    .finish {
      width: 100%;
      padding: 15px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background: #007bff;
      /* ←ここを元の青（#007bff）に書き換えて！ */
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
      /* 影も青っぽくしておいたよ */
      transition: all 0.2s;
    }

    .finish:active {
      transform: scale(0.96);
      background: #0056b3;
      /* 押した時も濃い青に！ */
    }

    #list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      padding: 15px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      border-left: 8px solid #ff9800;
      transition: all 0.2s;
    }

    .item.done {
      border-left: 8px solid #ccc;
      background: #fdfdfd;
      opacity: 0.6;
    }

    .line1 {
      font-weight: bold;
      font-size: 1em;
      margin-bottom: 4px;
      color: #222;
    }

    .line2 {
      font-size: 0.85em;
      color: #666;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75em;
      font-weight: bold;
      white-space: nowrap;
    }

    .status-00 {
      background: #fff3e0;
      color: #ff9800;
      border: 1px solid #ff9800;
    }

    .status-10 {
      background: #e8f5e9;
      color: #4caf50;
    }

    .status-11 {
      background: #e3f2fd;
      color: #2196f3;
    }

    .status-20 {
      background: #ffebee;
      color: #f44336;
    }
  </style>
</head>

<body>
  <h1 id="title">MV不良報告書一覧</h1>
  <div class="action-row">
    <button id="finishBtn" class="finish">確認処理完了</button>
  </div>
  <div id="list">読み込み中…</div>

  <script>
    async function main() {
      try {
        // ここに直接設定値を書いていたよね！
        await liff.init({ liffId: "2007688662-6dk5WiCy" });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        const profile = await liff.getProfile();
        const userId = profile.userId;

        const params = new URLSearchParams(window.location.search);
        let ownerCd = params.get("owner_cd");

        // 🌟 URLに担当者コードがない場合、DB(TempLiffData)に聞きに行く！
        if (!ownerCd) {
          const liffRes = await fetch(`https://test.unitemie.com/api/get-report?userId=${userId}`);
          if (liffRes.ok) {
            const liffData = await liffRes.json();
            ownerCd = liffData.OwnerCd;
          }
        }

        // それでも取れなければエラー
        if (!ownerCd) throw new Error("担当者コードが見つかりません。LINEから開き直してください。");

        // あとは、この ownerCd を使って一覧を取得するだけ！
        const res = await fetch(`https://test.unitemie.com/api/furyou/list?owner_cd=${ownerCd}`);
        if (!res.ok) throw new Error("データの取得に失敗しました");
        const reports = await res.json();

        const listEl = document.getElementById("list");
        listEl.innerHTML = "";
        let ownerLabel = "";

        if (reports.length === 0) {
          listEl.textContent = "対象の報告書はありません。";
          return;
        }

        reports.forEach((rep) => {
          console.log("★サーバーから届いた生データ:", rep);
          if (!ownerLabel && rep.ownerName) ownerLabel = `${rep.ownerCd} ${rep.ownerName}`;

          let statusTxt = "";
          let badgeClass = "";
          let isDone = true;

          // ステータス判定（ここは今のままで完璧！）
          if (rep.status === "10") {
            statusTxt = "✅ 承認済"; badgeClass = "status-10";
          } else if (rep.status === "11") {
            statusTxt = "🤖 自動承認"; badgeClass = "status-11";
          } else if (rep.status === "20") {
            statusTxt = "❌ 否認済"; badgeClass = "status-20";
          } else {
            statusTxt = "⏳ 未処理"; badgeClass = "status-00"; isDone = false;
          }

          const div = document.createElement("div");
          div.className = "item" + (isDone ? " done" : "");
          div.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div style="flex: 1;">
                <div class="line1">
                  ${rep.productName} 
                  <span style="font-size: 0.8em; color: #d32f2f; margin-left: 5px;">
                    ${rep.returnReason ? `(${rep.returnReason})` : ''}
                  </span>
                </div>
                <div class="line2">
                  店舗: ${rep.shopName}<br>
                  納品日: ${rep.deliveryDate}
                </div>
              </div>
              <div class="badge ${badgeClass}">${statusTxt}</div>
            </div>
          `;
          div.addEventListener("click", async () => {
            try {
              await fetch(`https://test.unitemie.com/api/save-report`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  userId: userId,
                  reportId: rep.id,
                  pdfFileName: rep.fileName // 次の詳細画面でPDFを開くために必要
                })
              });
              window.location.href = `https://liff.line.me/2007688662-oEf8sKgj?reportId=${rep.id}&v=${Date.now()}`;
            } catch (error) { alert(error); }
          });
          listEl.appendChild(div);
        });

        if (ownerLabel) document.getElementById("title").textContent = `一覧（${ownerLabel}）`;
      } catch (e) { alert(e); }
    }

    document.getElementById("finishBtn").addEventListener("click", () => {
      liff.isInClient() ? liff.closeWindow() : alert("ブラウザを閉じてください");
    });
    document.addEventListener("DOMContentLoaded", main);
  </script>
</body>

</html>
